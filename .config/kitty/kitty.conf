shell                         /bin/fish
editor                        nvim
enable_audio_bell             no # WHY THE HELL WOULD YOU WANT THIS ON

cursor_shape                  block
cursor_trail                  1
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  2

background_opacity            0.3
background_blur               1

window_padding_width          2

# BEGIN_KITTY_FONTS
font_family      family="SpaceMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
